name: ci
on:
  push: { branches: [main, mvp] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: ["22", "24"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.2.19" }
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: node --test --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-lines=80 'test/*.test.ts'
      - run: bun audit || true
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.2.19" }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: PW_DISABLE_TS_ESM=1 bunx playwright test
        env: { CI: "true" }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t arag-voice-bridge:ci .
